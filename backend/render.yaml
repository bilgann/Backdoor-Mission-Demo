services:
  - type: web
    name: backdoor-mission-backend
    runtime: python
    region: oregon
    plan: free
    branch: demo-readonly
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DEMO_READ_ONLY
        value: true
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.12.0
